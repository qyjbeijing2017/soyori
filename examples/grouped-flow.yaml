schemaVersion: 1
name: 分组示例
description: 变量和步骤的分组随流程分发，运行时仍然使用平铺变量。
fields:
  - name: chatIn
    input: true
    initial: 你好
  - type: group
    name: 回复配置
    description: 可折叠的默认配置。
    collapsed: true
    fields:
      - name: prefix
        initial: "收到："
      - name: chatOut
        output: true
steps:
  - type: group
    name: 生成回复
    description: 按顺序执行，无新增作用域。
    collapsed: true
    steps:
      - type: template
        template: $prefix$$chatIn$
        output: $chatOut
