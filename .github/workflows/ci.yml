name: Verify workspace
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      release_sha:
        description: Fixed release commit validated by the caller
        required: false
        type: string
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    timeout-minutes: 30
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: node --test scripts/deploy-editor.test.mjs scripts/release-ref.test.mjs
      - run: pnpm verify
      - run: pnpm --filter soyori-editor... build
      - run: pnpm release:pack
      - run: pnpm release:verify
