schemaVersion: 1
name: 单轮翻译助手
description: 输入一句中文，翻译成英文。每次运行独立，不保存对话记忆。
fields:
  chatIn:
    input: true
    initial: 今天的天气很好。
  prompt: {}
  chatOut:
    output: true
steps:
  - type: template
    template: |-
      把下面的中文翻译成英文，只返回译文：
      $chatIn$
    output: $prompt
  - type: call
    target: llm.auto
    inputs:
      input: $prompt
    outputs:
      result: $chatOut
